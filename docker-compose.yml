# =============================================================================
# SSU - UMSS | Solo la aplicación (API + interfaz)
# -----------------------------------------------------------------------------
# NO hay servicio de base de datos aqui, y es deliberado: el equipo trabaja
# contra UNA instancia en la nube (Supabase Cloud, PostgreSQL 16) compartida por
# los 6 integrantes. Levantar un postgres local produciria dos bases de datos
# divergentes y los bugs aparecerian solo en la nube.
#
# Todo el codigo fuente se monta desde la carpeta del proyecto, por lo que
# cualquier cambio local se refleja de inmediato en el contenedor.
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssu-umss-web:latest
    container_name: ssu_umss_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Credenciales y configuracion tomadas del .env personal de cada integrante
    #
    # `required: false` es deliberado. Sin esto, un clon nuevo que todavia no
    # copio el .env falla con un error de Compose que no explica nada:
    #   env file C:\...\.env not found: GetFileAttributesEx
    # El contenedor no levanta y parece un fallo de Docker en vez de un paso
    # pendiente de configuracion. Con la opcion opcional el sistema arranca
    # igual, y es la propia aplicacion la que dice que le falta DATABASE_URL,
    # en la portada y en /api/system/health. Requiere Compose v2.24 o superior.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/La_Paz
      NODE_ENV: development
      PORT: "3000"
    volumes:
      # Codigo del host: los cambios se reflejan sin reconstruir la imagen
      - .:/app
      # node_modules de la IMAGEN (volumenes anonimos) para no usar los del host.
      # Hace falta uno por paquete, no solo el de la raiz: en un monorepo de pnpm
      # cada workspace tiene su propio node_modules con enlaces simbolicos, y en
      # Windows esos enlaces apuntan a rutas del host que dentro del contenedor no
      # existen. Con un unico volumen en /app/node_modules, el bind mount tapaba
      # tambien frontend/node_modules y vite dejaba de resolverse.
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/db/node_modules
    # El arranque usa el CMD de la imagen (ssu-dev-watch): servidor Express con
    # reinicio automatico y recompilacion del frontend al detectar cambios
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/api/system/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stdin_open: true
    tty: false

# -----------------------------------------------------------------------------
# Red: IPv6 habilitado porque Supabase publica el host de base de datos
# unicamente con registro AAAA (sin IPv4). Sin IPv6 el contenedor no alcanza la
# base de datos y falla con ENETUNREACH.
#
# Las subredes se fijan a proposito: si Docker elige, puede tomar un rango que
# coincida con la red de la sala de la facultad o con la del campus, y el
# síntoma es un "network unreachable" que no dice nada del proyecto. Se pueden
# cambiar por variable de entorno si en tu maquina ya estan ocupadas:
#   SSU_SUBNET=172.28.0.0/16  SSU_SUBNET6=fd00:abcd:1234::/48  docker compose up -d
# NO copies las subredes de otro proyecto del equipo: dos redes con la misma
# subnet no pueden convivir y `docker compose up` falla al crearla con
# "Pool overlaps with other one on this address space".
# -----------------------------------------------------------------------------
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${SSU_SUBNET:-172.29.0.0/16}
        - subnet: ${SSU_SUBNET6:-fd00:0d0c:1c0d::/48}
